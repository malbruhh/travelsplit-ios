name: Automated Documentation Agent

on:
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'server/**'
      - 'convex/**'
      - 'package.json'

permissions:
  contents: write

jobs:
  auto-document:
    name: Scan Codebase & Update Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Documentation Agent
        run: npm run docs

      - name: Commit & Push Updated Documentation
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(docs): auto-update documentation from codebase scan [skip ci]"
          file_pattern: "docs/*"
          commit_user_name: "TravelSplit Doc Agent"
          commit_user_email: "actions@github.com"
          commit_author: "TravelSplit Doc Agent <actions@github.com>"
