services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: travelsplit-backend
    ports:
      - "5000:5000"
    volumes:
      - travelsplit-data:/app/data
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travelsplit-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  travelsplit-data:
